name: Feature request
description: Suggest an idea or improvement for the Pi Web macOS launcher.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem first, then
        your preferred solution — that makes it much easier to weigh trade-offs.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? What is frustrating today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the launcher to do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you rejected them.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, links, related issues, or anything else that helps.
    validations:
      required: false
