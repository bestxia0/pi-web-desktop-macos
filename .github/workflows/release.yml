name: Release

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN needs contents:write to create the release.
permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    # `macos-15` is the current arm64 image; the build is universal either way,
    # but avoid the retired `macos-13` / deprecated bare `macos-14` labels.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build app bundle
        run: ./build.sh

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Never publish a single-architecture build: the app claims macOS 13+,
      # and an arm64-only bundle will not launch on an Intel Mac.
      - name: Assert the bundle is universal
        run: |
          archs="$(lipo -archs build/PiWeb.app/Contents/MacOS/PiWeb)"
          echo "architectures: $archs"
          [[ "$archs" == *arm64* ]]  || { echo "!! missing arm64 slice" >&2; exit 1; }
          [[ "$archs" == *x86_64* ]] || { echo "!! missing x86_64 slice" >&2; exit 1; }

      - name: Documentation consistency
        run: ./scripts/check-docs.sh

      - name: Package app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/PiWeb.app "PiWeb-${{ steps.version.outputs.value }}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "PiWeb-${{ steps.version.outputs.value }}.zip" \
            --title "PiWeb ${{ steps.version.outputs.value }} (arm64 + x86_64)" \
            --generate-notes
